
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sprint2
      - feature/yzj-sprint2-improve
      # Sprint 3 候选分支：D8/D9 要求同一候选版本能在 CI 上构建通过
      - feature/lyx-sprint3-review
      - feature/shr-sprint3-governance

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AiJiaoXue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
